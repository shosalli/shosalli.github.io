<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Six-Day Gym Workout</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --accent: #f5c518;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #2d323c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header.page-header {
      padding: 1.5rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #1a1d24 0%, var(--bg) 100%);
    }

    header.page-header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 700;
    }

    header.page-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    nav.day-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    nav.day-nav a {
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    nav.day-nav a:hover,
    nav.day-nav a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }

    section.day {
      margin-top: 2.5rem;
      scroll-margin-top: 5.5rem;
    }

    .day-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 3px solid var(--accent);
    }

    .day-heading h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    .day-heading .focus {
      color: var(--accent);
      font-weight: 600;
      font-size: 1rem;
    }

    .day-heading .meta {
      color: var(--muted);
      font-size: 0.85rem;
      width: 100%;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
    }

    @media (min-width: 600px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }
    }

    @media (min-width: 900px) {
      .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    figure.card {
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    figure.card .img-wrap {
      aspect-ratio: 1422 / 728;
      background: #12151a;
      line-height: 0;
    }

    figure.card img {
      display: block;
      width: 100%;
      height: auto;
    }

    figure.card figcaption {
      padding: 0.35rem 0.5rem;
      font-size: 0.68rem;
      line-height: 1.3;
      color: var(--muted);
      border-top: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Full week gym workout</h1>
    <p>Slides grouped by day — filenames are <code>day.slide.png</code> (e.g. <code>1.3.png</code> = Monday, slide 3).</p>
  </header>

  <nav class="day-nav" id="day-nav" aria-label="Jump to day"></nav>

  <main id="app"></main>

  <script>
    const DAYS = [
      {
        id: 0,
        title: "Overview",
        focus: "Plan & intro",
        meta: "Full week schedule and getting started",
        slides: [1, 2, 3],
      },
      {
        id: 1,
        title: "Monday",
        focus: "Chest",
        meta: "Day 1",
        slides: [0, 1, 2, 3, 4, 5],
      },
      {
        id: 2,
        title: "Tuesday",
        focus: "Back",
        meta: "Day 2",
        slides: [0, 1, 2, 3, 4, 5],
      },
      {
        id: 3,
        title: "Wednesday",
        focus: "Arms (bi / tri)",
        meta: "Day 3",
        slides: [0, 1, 2, 3, 4, 5, 6],
      },
      {
        id: 4,
        title: "Thursday",
        focus: "Abs & forearms",
        meta: "Day 4",
        slides: [0, 1, 2, 3, 4, 5, 6],
      },
      {
        id: 5,
        title: "Friday",
        focus: "Shoulders",
        meta: "Day 5",
        slides: [0, 1, 2, 3, 4, 5],
      },
      {
        id: 6,
        title: "Saturday",
        focus: "Legs",
        meta: "Day 6",
        slides: [0, 1, 2, 3, 4, 5],
      },
      {
        id: 7,
        title: "Sunday",
        focus: "Rest",
        meta: "Day 7",
        slides: [0],
      },
    ];

    function slideLabel(day, slideIndex, position) {
      if (day.id === 0) return `Intro ${position}`;
      if (slideIndex === 0) return "Day header";
      return `Exercise slide ${slideIndex}`;
    }

    function fileName(dayId, slideIndex) {
      return `${dayId}.${slideIndex}.png`;
    }

    const nav = document.getElementById("day-nav");
    const app = document.getElementById("app");

    for (const day of DAYS) {
      const navLink = document.createElement("a");
      navLink.href = `#day-${day.id}`;
      navLink.textContent =
        day.id === 0 ? "Overview" : day.title.slice(0, 3);
      nav.appendChild(navLink);

      const section = document.createElement("section");
      section.className = "day";
      section.id = `day-${day.id}`;

      const heading = document.createElement("div");
      heading.className = "day-heading";
      heading.innerHTML = `
        <h2>${day.title}</h2>
        <span class="focus">${day.focus}</span>
        <span class="meta">${day.meta} · ${day.slides.length} slide${day.slides.length === 1 ? "" : "s"}</span>
      `;
      section.appendChild(heading);

      const gallery = document.createElement("div");
      gallery.className = "gallery";

      day.slides.forEach((slideIndex, i) => {
        const name = fileName(day.id, slideIndex);
        const figure = document.createElement("figure");
        figure.className = "card";

        const wrap = document.createElement("div");
        wrap.className = "img-wrap";

        const img = document.createElement("img");
        img.src = name;
        img.alt = `${day.title} — ${slideLabel(day, slideIndex, i + 1)}`;
        img.width = 1422;
        img.height = 728;
        img.decoding = "async";
        img.addEventListener("error", () => {
          if (img.dataset.retried) return;
          img.dataset.retried = "1";
          img.src = `${name}?${Date.now()}`;
        });

        const caption = document.createElement("figcaption");
        caption.textContent = `${name} · ${slideLabel(day, slideIndex, i + 1)}`;

        wrap.appendChild(img);
        figure.appendChild(wrap);
        figure.appendChild(caption);
        gallery.appendChild(figure);
      });

      section.appendChild(gallery);
      app.appendChild(section);
    }
  </script>
</body>
</html>
